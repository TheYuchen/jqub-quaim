<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets us reach into the iPhone notch/home-
         indicator gutters via env(safe-area-inset-*).
         interactive-widget=resizes-content makes iOS resize the
         layout viewport when the keyboard opens, so inputs stay
         visible instead of being hidden behind the keyboard. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <!-- Theme-color matches the canvas surface in both light + dark so
         the iOS / Android browser chrome blends instead of flashing
         white. Media-queried for prefers-color-scheme. The JS that
         applies stored themes overrides this where needed. -->
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuDA Studio" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>QuDA Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <!-- Apply stored theme before first paint so returning users who
         picked Dark or GMU don't see a flash of the light default. The
         light theme IS the :root default, so it needs no attribute. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("quda.theme");
          if (t === "dark" || t === "gmu") {
            document.documentElement.dataset.theme = t;
          }
        } catch (_) { /* ignore */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
